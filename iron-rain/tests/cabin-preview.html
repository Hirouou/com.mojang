<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mamute cabin verification</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191e19}canvas{width:100%;height:100%;display:block}#prompt{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#ddd8ac;font:12px monospace;pointer-events:none}</style><canvas id="c"></canvas><div id="prompt"></div><script type="module">
import {createCabinView} from '../modules/cabin-view.js';
const c=document.querySelector('canvas');window.cabin=createCabinView(c,{onStation:s=>{window.station=s}});cabin.setActive(true);cabin.resize(innerWidth,innerHeight);window.data={move:{x:0,y:0},bearing:90,elevation:45,charge:4,shellType:'HE',own:{x:8200,y:30000},mission:{x:11400,y:32500}};let last=performance.now();function tick(t){cabin.update((t-last)/1000,data);last=t;cabin.render();document.querySelector('#prompt').textContent=cabin.currentPrompt();requestAnimationFrame(tick);}requestAnimationFrame(tick);addEventListener('resize',()=>cabin.resize(innerWidth,innerHeight));addEventListener('keydown',e=>{if(e.key==='w')data.move.y=-1;if(e.key==='s')data.move.y=1;if(e.key==='a')data.move.x=-1;if(e.key==='d')data.move.x=1;if(e.key==='e')cabin.interact();if(e.key==='Escape')cabin.leaveStation();});addEventListener('keyup',()=>data.move={x:0,y:0});
</script></html>
