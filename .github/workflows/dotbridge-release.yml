name: Publish DotBridge 1.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotbridge-release-1.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: dotbridge
    steps:
      - name: Check out the validated source and binary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify the retained binaries and installer
        run: |
          sha256sum --check SHA256SUMS.txt
          python3 -m unittest discover -s client -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_profile.py docs/aetherfall-manifest.json

      - name: Package the tested binary with the Linux installer
        run: |
          python3 tools/package_release.py --jar dotbridge-1.1.0.jar --output build/release
          cd build/release
          sha256sum --check SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > build/release-notes.md <<'EOF'
          Atualização do DotBridge existente para Minecraft Java 1.21.1, NeoForge 21.1.259 e Linux.

          Inclui objetivos locais limitados, câmera suave, cumprimento frontal/F5, percepção visível, heartbeat, eventos e inventário/crafting por IDs de slots.
          Mineração e coleta têm evidências separadas; operações de inventário aguardam atualizações do servidor.

          Validação: 244 testes automatizados e 31 cenários cobertos no cliente de desenvolvimento, com os mods de compatibilidade do pacote e os mesmos arquivos de classes/recursos do JAR. Inclui crafting real com Spatial GUI; a repetição de coleta e as medições separadas estão documentadas. Aetherfall completo e TLauncher não foram executados.

          O instalador sem argumentos apenas prepara staging. Feche o jogo e siga `dotbridge/ATUALIZACAO-1.1.md` no repositório para atualizar ou reverter. A versão 1.0.0 permanece disponível; nunca coloque as duas na mesma pasta mods.
          Guia do Dot: `INSTRUCOES_PARA_O_DOT.md`. API: `dotbridge/API-1.1.md`. Resultados medidos e limites: `dotbridge/VALIDACAO.md`.

          O modpack original permanece na release `aetherfall-2.0-2026-10-19`.
          EOF
          gh release create dotbridge-v1.1.0 build/release/* \
            --target "$GITHUB_SHA" \
            --title "DotBridge 1.1.0 — Aetherfall 2.0 / Linux" \
            --notes-file build/release-notes.md \
            --latest=false
