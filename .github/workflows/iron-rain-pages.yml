name: Publish Iron Rain

on:
  push:
    branches:
      - iron-rain-v6-1-continuation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use server-compatible Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Iron Rain
        id: iron-rain-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd iron-rain
          mkdir -p test-results
          npm test 2>&1 | tee test-results/ci-test.log
      - name: Upload failed test log
        if: steps.iron-rain-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: iron-rain-ci-test-log
          path: iron-rain/test-results/ci-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce Iron Rain tests
        if: steps.iron-rain-tests.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Iron Rain site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R iron-rain/. _site/
          rm -rf _site/tests _site/docs _site/test-results _site/server
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
