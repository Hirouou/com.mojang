name: Roads Mobility CI

on:
  push:
    branches:
      - agent/roads-mobility-20260913

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Mamute entrypoint
        run: cd iron-rain && node --check game-v6.js
      - name: Run requested Iron Rain suite
        run: cd iron-rain && npm test
