name: Iron Rain Cabin Recovery

on:
  push:
    branches: [iron-rain-v6-1-continuation]
    paths: [.github/workflows/iron-rain-cabin-hotfix.yml]

permissions:
  contents: write

jobs:
  recover-cabin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iron-rain-v6-1-continuation
          fetch-depth: 0
      - name: Apply cabin recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('iron-rain/game-v6.js')
          s=p.read_text()
          def r(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing {label}')
              s=s.replace(old,new,1)
          r("  const inside=()=>state?.view==='cabin'&&!cinematicActive(state)&&!cabinFailed;", "  const inside=()=>!!cabin&&state?.view==='cabin'&&!cinematicActive(state)&&!cabinFailed;", 'cabin readiness')
          r("    cabin?.update(dt,{move,bearing:state.bearing,elevation:state.elev,charge:state.charge,shellType:selectedShell,wind:state.wind,own:state.robot,mission:state.mission?.report,paused:!!sheetOpen||!UI.radio.classList.contains('hidden'),loading:state.loading,recoil:state.robot.recoil,shotElapsed:state.shotElapsed,engine:state.engine});\n    const cabinPosition=cabin?.snapshot?.().position;", "    try{cabin?.update(dt,{move,bearing:state.bearing,elevation:state.elev,charge:state.charge,shellType:selectedShell,wind:state.wind,own:state.robot,mission:state.mission?.report,paused:!!sheetOpen||!UI.radio.classList.contains('hidden'),loading:state.loading,recoil:state.robot.recoil,shotElapsed:state.shotElapsed,engine:state.engine});}catch(error){console.error('Cabin update failed:',error);cabinFailed=true;state.view='field';syncControls();}\n    let cabinPosition=null;try{cabinPosition=cabin?.snapshot?.().position||null;}catch(error){console.error('Cabin snapshot failed:',error);cabinFailed=true;state.view='field';syncControls();}", 'cabin update')
          r("    if(inside()&&cabin){cabin.render();return;}", "    if(inside()&&cabin){try{cabin.render();return;}catch(error){console.error('Cabin render failed:',error);cabinFailed=true;state.view='field';syncControls();}}", 'cabin render')
          r("  function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop);}", "  function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;try{update(dt);}catch(error){console.error('Frame update failed:',error);if(state?.view==='cabin'){cabinFailed=true;state.view='field';try{syncControls();}catch{}}}try{draw();}catch(error){console.error('Frame draw failed:',error);if(state?.view==='cabin'){cabinFailed=true;state.view='field';try{syncControls();}catch{}}}requestAnimationFrame(loop);}", 'frame survival')
          p.write_text(s)
          p=Path('iron-rain/bootstrap.js');s=p.read_text();s=s.replace("const CLIENT_BUILD = '20260913-hidden-aim-panel';","const CLIENT_BUILD = '20260913-cabin-green-screen-hotfix';",1).replace("const EXPECTED_CACHE_SUFFIX = 'v7.29';","const EXPECTED_CACHE_SUFFIX = 'v7.30';",1);p.write_text(s)
          p=Path('iron-rain/sw.js');s=p.read_text().replace("const CACHE_NAME = `${CACHE_PREFIX}v7.29`;","const CACHE_NAME = `${CACHE_PREFIX}v7.30`;",1);p.write_text(s)
          PY
      - name: Verify recovery patch
        shell: bash
        run: |
          grep -F "const inside=()=>!!cabin" iron-rain/game-v6.js
          grep -F "Cabin render failed" iron-rain/game-v6.js
          grep -F "cabin-green-screen-hotfix" iron-rain/bootstrap.js
          grep -F 'v7.30' iron-rain/sw.js
      - name: Test Iron Rain
        working-directory: iron-rain
        run: npm test
      - name: Commit and publish trigger
        shell: bash
        run: |
          git config user.name "Iron Rain Cabin Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add iron-rain/game-v6.js iron-rain/bootstrap.js iron-rain/sw.js
          git diff --cached --check
          git commit -m "fix: recover Mamute cabin from green screen"
          git push origin HEAD:iron-rain-v6-1-continuation
