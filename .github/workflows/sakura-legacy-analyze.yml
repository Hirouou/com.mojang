name: Sakura Legacy IL2CPP Analysis

on:
  push:
    branches:
      - agent/sakura-lan-20260919
    paths:
      - ".github/workflows/sakura-legacy-analyze.yml"
  workflow_dispatch:

jobs:
  analyze-104304:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download Sakura 1.043.04
        run: |
          mkdir -p legacy/input legacy/xapk legacy/unpacked
          docker run --rm             -v "$PWD/legacy/input:/output"             ghcr.io/efforg/apkeep:stable             -a jp.garud.ssimulator@1.043.04 /output
          unzip -q legacy/input/*.xapk -d legacy/xapk
          for a in legacy/xapk/*.apk; do
            d="legacy/unpacked/$(basename "$a" .apk)"
            mkdir -p "$d"
            unzip -q "$a" -d "$d" || true
          done
          find legacy/xapk -maxdepth 1 -type f -printf '%f %s\n' | sort

      - name: Extract Unity text assets
        shell: bash
        run: |
          python3 -m pip install --quiet UnityPy
          mkdir -p legacy/unity-text
          python3 - <<'PY'
          import json, pathlib, re
          import UnityPy
          roots = list(pathlib.Path("legacy/unpacked").rglob("datapack.unity3d"))
          roots += list(pathlib.Path("legacy/unpacked").rglob("data.unity3d"))
          index, used = [], {}
          outdir = pathlib.Path("legacy/unity-text")
          for source in roots:
              env = UnityPy.load(str(source))
              for obj in env.objects:
                  if obj.type.name != "TextAsset":
                      continue
                  try:
                      data = obj.read()
                      name = getattr(data, "m_Name", "") or f"text_{obj.path_id}"
                      raw = getattr(data, "m_Script", b"")
                      blob = raw.encode("utf-8", "replace") if isinstance(raw, str) else bytes(raw)
                      safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", name).strip("._") or f"text_{obj.path_id}"
                      n = used.get(safe, 0); used[safe] = n + 1
                      if n: safe += f"_{n}"
                      path = outdir / (safe + ".txt")
                      path.write_bytes(blob)
                      index.append({"source": str(source), "name": name, "path_id": obj.path_id, "file": path.name, "bytes": len(blob)})
                  except Exception as exc:
                      index.append({"source": str(source), "path_id": obj.path_id, "error": repr(exc)})
          (outdir / "index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Resolve IL2CPP inputs
        shell: bash
        run: |
          IL2CPP="$(find legacy/unpacked -type f -name libil2cpp.so | head -n1)"
          META="$(find legacy/unpacked -type f -name global-metadata.dat | head -n1)"
          UNITY="$(find legacy/unpacked -type f -name libunity.so | head -n1)"
          VERSION="$(strings -a "$UNITY" | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+f[0-9]+' | head -n1)"
          {
            echo "IL2CPP=$IL2CPP"
            echo "META=$META"
            echo "UNITY=$UNITY"
            echo "VERSION=$VERSION"
          } | tee legacy/env.txt
          echo "metadata_magic=$(xxd -p -l 16 "$META")" | tee -a legacy/env.txt
          echo "exports=$(nm -D --defined-only "$IL2CPP" | grep -c ' il2cpp_' || true)" | tee -a legacy/env.txt

      - name: Dump IL2CPP metadata
        id: dump
        continue-on-error: true
        shell: bash
        run: |
          source legacy/env.txt
          mkdir -p legacy/dumper legacy/dumper/out
          strings -a "$META" > legacy/metadata-strings.txt || true
          curl -L --fail --retry 3 \
            -o legacy/dumper/Il2CppDumper.zip \
            https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
          unzip -q legacy/dumper/Il2CppDumper.zip -d legacy/dumper/tool

          set +e
          DOTNET_ROLL_FORWARD=Major dotnet legacy/dumper/tool/Il2CppDumper.dll \
            "$IL2CPP" "$META" "$PWD/legacy/dumper/out" \
            > legacy/dumper/dumper.log 2>&1
          CODE=$?
          set -e
          echo "$CODE" > legacy/dumper/exit-code.txt
          tail -n 300 legacy/dumper/dumper.log || true
          test "$CODE" -eq 0

      - name: Extract serialized localization tables
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DLLDIR="legacy/dumper/out/DummyDll"
          if [ ! -d "$DLLDIR" ]; then
            echo "DummyDll output unavailable; skipping serialized localization extraction."
            exit 0
          fi
          python3 -m pip install --quiet UnityPy TypeTreeGeneratorAPI
          mkdir -p legacy/unity-text/monobehaviour
          python3 - <<'PY'
          import json, pathlib, re
          import UnityPy
          from UnityPy.helpers.TypeTreeGenerator import TypeTreeGenerator

          roots = list(pathlib.Path("legacy/unpacked").rglob("datapack.unity3d"))
          roots += list(pathlib.Path("legacy/unpacked").rglob("data.unity3d"))
          if not roots:
              raise SystemExit("Unity data files not found")

          env0 = UnityPy.load(str(roots[0]))
          first = next(iter(env0.objects), None)
          if first is None:
              raise SystemExit("No Unity objects found")
          generator = TypeTreeGenerator(first.assets_file.unity_version)
          generator.load_dll_folder("legacy/dumper/out/DummyDll")

          outdir = pathlib.Path("legacy/unity-text/monobehaviour")
          index = []
          markers = ("English", "strEng", "ButtonLabel", "ButtonName", "EventNotice",
                     "Aisatu", "Damage", "Shop", "Message", "CurrentLanguageKey")
          for source in roots:
              env = UnityPy.load(str(source))
              env.typetree_generator = generator
              for obj in env.objects:
                  if obj.type.name != "MonoBehaviour":
                      continue
                  try:
                      tree = obj.read_typetree()
                      probe = json.dumps(tree, ensure_ascii=False, default=str)
                      if not any(m in probe for m in markers):
                          continue
                      name = str(tree.get("m_Name") or f"mono_{obj.path_id}")
                      safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", name).strip("._") or f"mono_{obj.path_id}"
                      path = outdir / f"{safe}_{obj.path_id}.json"
                      path.write_text(json.dumps(tree, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
                      index.append({"source": str(source), "name": name, "path_id": obj.path_id, "file": path.name})
                  except Exception:
                      pass
          (outdir / "index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Localization MonoBehaviours:", len(index))
          print("\n".join(f"{x['name']} {x['path_id']}" for x in index[:300]))
          PY

      - name: Decompile gameplay, world and localization types
        if: always()
        shell: bash
        run: |
          ASM="$(find legacy/dumper/out -type f -name Assembly-CSharp.dll | head -n1 || true)"
          echo "assembly=$ASM" | tee legacy/assembly-path.txt
          mkdir -p legacy/decompiled legacy/selected

          if [ -n "$ASM" ]; then
            dotnet tool install --global ilspycmd
            export PATH="$PATH:$HOME/.dotnet/tools"
            ilspycmd "$ASM" -p -o legacy/decompiled > legacy/ilspy.log 2>&1
          else
            echo "Assembly-CSharp.dll was not generated; retaining raw metadata strings for inspection." | tee legacy/ilspy.log
          fi

          find legacy/decompiled -type f -name '*.cs' -printf '%p\n' | sort > legacy/decompiled-files.txt
          grep -RniE --include='*.cs'             'class (CharaMove|CharacterBaseManager|CharaMakeTPCManager|CanvasJoystickManager|Localize|LocalizeUI|ButtonSetting)|GameObject\.Find|Instantiate\(|SetActive\(|transform\.(position|rotation)|Animator|CharacterController|Vehicle|Car|Bike|Traffic|Garage|Mission|Quest|Event|Money|Item|Pickup|GetItem|GameTime|Weather|Language|Localize|ChangeLanguage'             legacy/decompiled | head -n 8000 > legacy/player-symbols.txt || true

          for n in CharaMove CharacterBaseManager CharaMakeTPCManager CanvasJoystickManager Localize LocalizeUI ButtonSetting LanguageType; do
            p="$(find legacy/decompiled -type f -name "$n.cs" | head -n1 || true)"
            if [ -n "$p" ]; then cp "$p" "legacy/selected/$n.cs"; fi
          done

          grep -RniE --include='*.cs' 'Vehicle|Car|Bike|Traffic|Garage|Ride|Mission|Quest|Event|Money|Item|Pickup|GetItem|GameTime|Weather|Language|Localize|ChangeLanguage|Relationship|Relation|Friend|Lover|Love|Like|Dislike|Hate|Talk|Conversation|Message|Chat|Mail|Aisatu|Favor|Affinity' legacy/decompiled | head -n 16000 > legacy/world-symbols.txt || true
          cut -d: -f1 legacy/world-symbols.txt | sort -u | head -n 200 > legacy/world-files.txt || true
          while IFS= read -r p; do
            [ -f "$p" ] || continue
            cp "$p" "legacy/selected/world_$(basename "$p")"
          done < legacy/world-files.txt

          find legacy/selected -type f -printf '%f %s\n' | sort

      - name: Extract localization TextAssets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q UnityPy
          mkdir -p legacy/localization-assets
          python - <<'PY'
          import pathlib, re
          import UnityPy

          roots = list(pathlib.Path("legacy/unpacked").rglob("datapack.unity3d"))
          roots += list(pathlib.Path("legacy/unpacked").rglob("data.unity3d"))
          index = []
          for source in roots:
              try:
                  env = UnityPy.load(str(source))
              except Exception as exc:
                  index.append(f"ERROR\t{source}\t{exc}")
                  continue
              for obj in env.objects:
                  if obj.type.name != "TextAsset":
                      continue
                  try:
                      data = obj.read()
                      name = getattr(data, "m_Name", None) or getattr(data, "name", None) or f"textasset_{obj.path_id}"
                      raw = getattr(data, "m_Script", None)
                      if raw is None:
                          raw = getattr(data, "script", b"")
                      if isinstance(raw, str):
                          raw = raw.encode("utf-8", "replace")
                      safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", str(name))[:120] or f"textasset_{obj.path_id}"
                      out = pathlib.Path("legacy/localization-assets") / f"{safe}_{obj.path_id}.txt"
                      out.write_bytes(bytes(raw))
                      index.append(f"OK\t{source}\t{obj.path_id}\t{name}\t{len(raw)}\t{out}")
                  except Exception as exc:
                      index.append(f"ERROR_OBJ\t{source}\t{obj.path_id}\t{exc}")
          pathlib.Path("legacy/localization-assets/index.tsv").write_text("\n".join(index), encoding="utf-8")
          PY
          grep -RIlE 'English|Japanese|ChineseS|ButtonName|ButtonLabel|EventNotice|Aisatu|Mission|Trophy' legacy/localization-assets             | sort > legacy/localization-assets/candidates.txt || true
          while IFS= read -r p; do
            echo "===== $p ====="
            sed -n '1,80p' "$p" || true
          done < legacy/localization-assets/candidates.txt > legacy/localization-assets/preview.txt

      - name: Upload legacy analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-legacy-104304-analysis
          path: |
            legacy/env.txt
            legacy/assembly-path.txt
            legacy/dumper/dumper.log
            legacy/dumper/exit-code.txt
            legacy/dumper/out/dump.cs
            legacy/dumper/out/script.json
            legacy/metadata-strings.txt
            legacy/unity-text/
            legacy/ilspy.log
            legacy/player-symbols.txt
            legacy/world-symbols.txt
            legacy/world-files.txt
            legacy/decompiled-files.txt
            legacy/localization-assets/
            legacy/selected/
          if-no-files-found: error
