name: Sakura Patched Runtime Smoke

on:
  push:
    branches:
      - agent/sakura-lan-20260919
    paths:
      - ".github/workflows/sakura-patched-smoke.yml"
      - "sakura-lan-mod/native/**"
      - "sakura-lan-mod/tools/patch_split_pack.sh"
  workflow_dispatch:

jobs:
  patched-arm64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build native runtime probe
        run: |
          cmake -S sakura-lan-mod/native -B sakura-lan-mod/native-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24
          cmake --build sakura-lan-mod/native-build --parallel

      - name: Download and patch split pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zip
          mkdir -p sakura-lan-mod/emulator/input sakura-lan-mod/emulator/xapk sakura-lan-mod/emulator/patched
          docker run --rm \
            -v "$PWD/sakura-lan-mod/emulator/input:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a jp.garud.ssimulator@1.048.10 /output
          unzip -q sakura-lan-mod/emulator/input/*.xapk -d sakura-lan-mod/emulator/xapk
          bash sakura-lan-mod/tools/patch_split_pack.sh \
            sakura-lan-mod/emulator/xapk \
            sakura-lan-mod/native-build/libsakuralan.so \
            sakura-lan-mod/emulator/patched

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and launch patched game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euxo pipefail
            OUT="$PWD/sakura-lan-mod/emulator/patched/evidence"
            mkdir -p "$OUT"
            adb shell getprop ro.product.cpu.abilist | tee "$OUT/abilist.txt"
            adb shell getprop ro.dalvik.vm.native.bridge | tee "$OUT/native-bridge.txt"

            D="$PWD/sakura-lan-mod/emulator/patched/signed"
            adb install-multiple -r \
              "$D/jp.garud.ssimulator.apk" \
              "$D/config.arm64_v8a.apk" \
              "$D/UnityDataAssetPack.apk"

            adb logcat -c
            adb shell monkey -p jp.garud.ssimulator -c android.intent.category.LAUNCHER 1 || true
            sleep 55

            adb logcat -d -v threadtime > "$OUT/logcat.txt" || true
            adb exec-out screencap -p > "$OUT/patched.png" || true
            adb shell pidof jp.garud.ssimulator > "$OUT/pid.txt" || true
            grep -E 'SakuraLAN|FATAL EXCEPTION|SIGABRT|SIGSEGV|UnsatisfiedLinkError|pairip|pgl|integrity' \
              "$OUT/logcat.txt" | tail -n 1500 > "$OUT/relevant-logcat.txt" || true

            echo "=== PID ==="
            cat "$OUT/pid.txt" || true
            echo "=== SakuraLAN ==="
            grep 'SakuraLAN' "$OUT/logcat.txt" | tail -n 500 || true

      - name: Upload patched smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-patched-runtime-smoke
          path: |
            sakura-lan-mod/emulator/patched/evidence/
            sakura-lan-mod/emulator/patched/work/libmain-signed.so
          if-no-files-found: warn
