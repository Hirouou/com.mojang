name: Sakura Current ARM64 Patched Runtime

on:
  push:
    branches:
      - agent/sakura-lan-20260919
    paths:
      - ".github/workflows/sakura-current-arm64-patched.yml"
      - "sakura-lan-mod/native/**"
      - "sakura-lan-mod/src/**"
      - "sakura-lan-mod/tools/patch_split_pack.sh"
      - "sakura-lan-mod/tools/patch_launcher_manifest.py"
      - "sakura-lan-mod/android/**"
  workflow_dispatch:

jobs:
  build-patched-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build injected ARM64 library
        run: |
          cmake -S sakura-lan-mod/native -B sakura-lan-mod/native-build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24
          cmake --build sakura-lan-mod/native-build-arm64 --parallel
          file sakura-lan-mod/native-build-arm64/libsakuralan.so
          readelf -d sakura-lan-mod/native-build-arm64/libsakuralan.so | grep NEEDED || true

      - name: Download Sakura package
        run: |
          mkdir -p sakura-lan-mod/arm64/input sakura-lan-mod/arm64/xapk sakura-lan-mod/arm64/patched
          docker run --rm \
            -v "$PWD/sakura-lan-mod/arm64/input:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a jp.garud.ssimulator@1.048.10 /output
          unzip -q sakura-lan-mod/arm64/input/*.xapk -d sakura-lan-mod/arm64/xapk
          find sakura-lan-mod/arm64/xapk -maxdepth 1 -type f -printf '%f %s\n' | sort

      - name: Build Host Join launcher DEX
        run: |
          PLATFORM_JAR="$(find "$ANDROID_HOME/platforms" -maxdepth 2 -type f -name android.jar | sort -V | tail -n1)"
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          mkdir -p sakura-lan-mod/android-build/classes sakura-lan-mod/android-build/dex
          javac -source 8 -target 8 \
            -classpath "$PLATFORM_JAR" \
            -d sakura-lan-mod/android-build/classes \
            sakura-lan-mod/android/jp/garud/ssimulator/SakuraLanActivity.java
          "$BUILD_TOOLS/d8" --min-api 24 \
            --output sakura-lan-mod/android-build/dex \
            $(find sakura-lan-mod/android-build/classes -type f -name '*.class')
          test -s sakura-lan-mod/android-build/dex/classes.dex
          curl -L --fail --retry 3 \
            -o sakura-lan-mod/android-build/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

      - name: Patch and sign APK splits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zip
          bash sakura-lan-mod/tools/patch_split_pack.sh \
            sakura-lan-mod/arm64/xapk \
            sakura-lan-mod/native-build-arm64/libsakuralan.so \
            sakura-lan-mod/arm64/patched \
            sakura-lan-mod/android-build/dex/classes.dex \
            sakura-lan-mod/android-build/apktool.jar
          ls -lh sakura-lan-mod/arm64/patched/signed/

      - uses: actions/upload-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: |
            sakura-lan-mod/arm64/patched/signed/jp.garud.ssimulator.apk
            sakura-lan-mod/arm64/patched/signed/config.arm64_v8a.apk
            sakura-lan-mod/arm64/patched/signed/UnityDataAssetPack.apk
            sakura-lan-mod/native-build-arm64/libsakuralan.so
          if-no-files-found: error
          compression-level: 1

  current-arm64-patched:
    needs: build-patched-apks
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/prebuilt

      - name: Show patched package and runner architecture
        run: |
          uname -a
          uname -m
          find sakura-lan-mod/prebuilt -maxdepth 3 -type f -exec ls -lh {} \;
          test -f sakura-lan-mod/prebuilt/jp.garud.ssimulator.apk
          test -f sakura-lan-mod/prebuilt/config.arm64_v8a.apk
          test -f sakura-lan-mod/prebuilt/UnityDataAssetPack.apk

      - name: Boot native ARM64 emulator and run patched Sakura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            mkdir -p sakura-lan-mod/arm64/evidence
            adb shell getprop ro.product.cpu.abilist > sakura-lan-mod/arm64/evidence/abilist.txt

            adb install-multiple -r               sakura-lan-mod/prebuilt/jp.garud.ssimulator.apk               sakura-lan-mod/prebuilt/config.arm64_v8a.apk               sakura-lan-mod/prebuilt/UnityDataAssetPack.apk

            adb shell pm list packages | grep jp.garud.ssimulator > sakura-lan-mod/arm64/evidence/package.txt
            adb logcat -c
            adb shell monkey -p jp.garud.ssimulator -c android.intent.category.LAUNCHER 1 || true
            sleep 90

            adb shell pidof jp.garud.ssimulator > sakura-lan-mod/arm64/evidence/pid.txt || true
            adb shell dumpsys activity activities > sakura-lan-mod/arm64/evidence/activities.txt || true
            adb logcat -d -v threadtime > sakura-lan-mod/arm64/evidence/logcat.txt || true
            adb exec-out screencap -p > sakura-lan-mod/arm64/evidence/patched-current.png || true
            grep 'SakuraLAN' sakura-lan-mod/arm64/evidence/logcat.txt | tail -n 10000 > sakura-lan-mod/arm64/evidence/sakuralan-log.txt || true
            grep -Ei 'FATAL EXCEPTION|SIGABRT|SIGSEGV|UnsatisfiedLinkError|INSTALL_FAILED|integrity|pairip|pgl' sakura-lan-mod/arm64/evidence/logcat.txt | tail -n 1000 > sakura-lan-mod/arm64/evidence/fatal-log.txt || true

            echo "=== PID ==="
            cat sakura-lan-mod/arm64/evidence/pid.txt || true
            echo "=== SakuraLAN runtime probe ==="
            cat sakura-lan-mod/arm64/evidence/sakuralan-log.txt || true
            echo "=== fatal markers ==="
            cat sakura-lan-mod/arm64/evidence/fatal-log.txt || true

            test -s sakura-lan-mod/arm64/evidence/pid.txt
            grep -q 'libsakuralan loaded' sakura-lan-mod/arm64/evidence/sakuralan-log.txt

      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-current-arm64-patched
          path: sakura-lan-mod/arm64/evidence/
          if-no-files-found: warn
