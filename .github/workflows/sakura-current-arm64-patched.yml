name: Sakura Current ARM64 Patched Runtime

on:
  push:
    branches:
      - agent/sakura-lan-20260919
    paths:
      - ".github/workflows/sakura-current-arm64-patched.yml"
      - "sakura-lan-mod/native/**"
      - "sakura-lan-mod/src/**"
      - "sakura-lan-mod/tools/patch_split_pack.sh"
      - "sakura-lan-mod/tools/patch_launcher_manifest.py"
      - "sakura-lan-mod/android/**"
  workflow_dispatch:

jobs:
  build-patched-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build injected ARM64 library
        run: |
          cmake -S sakura-lan-mod/native -B sakura-lan-mod/native-build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24
          cmake --build sakura-lan-mod/native-build-arm64 --parallel
          file sakura-lan-mod/native-build-arm64/libsakuralan.so
          readelf -d sakura-lan-mod/native-build-arm64/libsakuralan.so | grep NEEDED || true

      - name: Download Sakura package
        run: |
          mkdir -p sakura-lan-mod/arm64/input sakura-lan-mod/arm64/xapk sakura-lan-mod/arm64/patched
          docker run --rm \
            -v "$PWD/sakura-lan-mod/arm64/input:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a jp.garud.ssimulator@1.048.10 /output
          unzip -q sakura-lan-mod/arm64/input/*.xapk -d sakura-lan-mod/arm64/xapk
          find sakura-lan-mod/arm64/xapk -maxdepth 1 -type f -printf '%f %s\n' | sort

      - name: Build Host Join launcher DEX
        shell: bash
        run: |
          PLATFORM_JAR="$(find "$ANDROID_HOME/platforms" -maxdepth 2 -type f -name android.jar | sort -V | tail -n1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mkdir -p sakura-lan-mod/android-build/classes sakura-lan-mod/android-build/dex

          javac -source 8 -target 8 \
            -classpath "$PLATFORM_JAR" \
            -d sakura-lan-mod/android-build/classes \
            sakura-lan-mod/android/jp/garud/ssimulator/SakuraLanActivity.java

          mapfile -t CLASS_FILES < <(find sakura-lan-mod/android-build/classes -type f -name '*.class' | sort)
          "$BUILD_TOOLS/d8" --min-api 24 \
            --output sakura-lan-mod/android-build/dex \
            "${CLASS_FILES[@]}"

          test -s sakura-lan-mod/android-build/dex/classes.dex
          curl -L --fail --retry 3 \
            -o sakura-lan-mod/android-build/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar

      - name: Patch and sign APK splits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zip
          bash sakura-lan-mod/tools/patch_split_pack.sh \
            sakura-lan-mod/arm64/xapk \
            sakura-lan-mod/native-build-arm64/libsakuralan.so \
            sakura-lan-mod/arm64/patched \
            sakura-lan-mod/android-build/dex/classes.dex \
            sakura-lan-mod/android-build/apktool.jar
          find sakura-lan-mod/arm64/patched/signed -maxdepth 1 -type f -name '*.apk' -printf '%f %s\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/arm64/patched/signed/*.apk
          if-no-files-found: error
          compression-level: 1

  current-arm64-patched:
    needs: build-patched-apks
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/prebuilt

      - name: Show patched package and runner architecture
        run: |
          uname -a
          uname -m
          find sakura-lan-mod/prebuilt -maxdepth 2 -type f -exec ls -lh {} \;
          test -f sakura-lan-mod/prebuilt/jp.garud.ssimulator.apk
          test -f sakura-lan-mod/prebuilt/config.arm64_v8a.apk
          test -f sakura-lan-mod/prebuilt/UnityDataAssetPack.apk

      - name: Boot native ARM64 emulator and run patched Sakura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            mkdir -p sakura-lan-mod/arm64/evidence
            adb shell getprop ro.product.cpu.abilist > sakura-lan-mod/arm64/evidence/abilist.txt

            adb install-multiple -r               sakura-lan-mod/prebuilt/jp.garud.ssimulator.apk               sakura-lan-mod/prebuilt/config.arm64_v8a.apk               sakura-lan-mod/prebuilt/UnityDataAssetPack.apk

            adb shell pm list packages | grep jp.garud.ssimulator > sakura-lan-mod/arm64/evidence/package.txt
            adb logcat -c
            adb shell monkey -p jp.garud.ssimulator -c android.intent.category.LAUNCHER 1 || true
            sleep 12
            adb exec-out screencap -p > sakura-lan-mod/arm64/evidence/lan-menu.png || true

            # The smoke test does not press Host/Join yet. It validates that the
            # patched launcher and injected native library can coexist and launch.
            sleep 25
            adb shell pidof jp.garud.ssimulator > sakura-lan-mod/arm64/evidence/pid.txt || true
            adb shell dumpsys activity activities > sakura-lan-mod/arm64/evidence/activities.txt || true
            adb logcat -d -v threadtime > sakura-lan-mod/arm64/evidence/logcat.txt || true
            adb exec-out screencap -p > sakura-lan-mod/arm64/evidence/patched-current.png || true
            grep 'SakuraLAN' sakura-lan-mod/arm64/evidence/logcat.txt | tail -n 10000 > sakura-lan-mod/arm64/evidence/sakuralan-log.txt || true
            grep -Ei 'FATAL EXCEPTION|SIGABRT|SIGSEGV|UnsatisfiedLinkError|INSTALL_FAILED|integrity|pairip|pgl' sakura-lan-mod/arm64/evidence/logcat.txt | tail -n 1000 > sakura-lan-mod/arm64/evidence/fatal-log.txt || true

            echo "=== PID ==="
            cat sakura-lan-mod/arm64/evidence/pid.txt || true
            echo "=== SakuraLAN runtime ==="
            cat sakura-lan-mod/arm64/evidence/sakuralan-log.txt || true
            echo "=== fatal markers ==="
            cat sakura-lan-mod/arm64/evidence/fatal-log.txt || true

            test -s sakura-lan-mod/arm64/evidence/pid.txt
            grep -q 'libsakuralan loaded' sakura-lan-mod/arm64/evidence/sakuralan-log.txt

      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-current-arm64-patched
          path: sakura-lan-mod/arm64/evidence/
          if-no-files-found: warn


  dual-user-lan-smoke:
    needs: build-patched-apks
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/dual/prebuilt

      - name: Boot one ARM64 emulator with two Android users
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            set -e
            OUT=sakura-lan-mod/dual/evidence
            mkdir -p "$OUT"

            adb install-multiple -r \
              sakura-lan-mod/dual/prebuilt/jp.garud.ssimulator.apk \
              sakura-lan-mod/dual/prebuilt/config.arm64_v8a.apk \
              sakura-lan-mod/dual/prebuilt/UnityDataAssetPack.apk

            CREATE="$(adb shell pm create-user SakuraClient)"
            echo "$CREATE" | tee "$OUT/create-user.txt"
            CLIENT_USER="$(echo "$CREATE" | sed -n 's/.* id \([0-9][0-9]*\).*/\1/p')"
            test -n "$CLIENT_USER"
            echo "$CLIENT_USER" > "$OUT/client-user-id.txt"

            adb shell pm install-existing --user "$CLIENT_USER" jp.garud.ssimulator
            adb logcat -c

            echo "=== HOST USER 0 ==="
            adb shell am start -W --user 0 \
              -n jp.garud.ssimulator/jp.garud.ssimulator.SakuraLanActivity \
              --es sakuralan_mode host | tee "$OUT/host-start.txt"
            sleep 7
            adb shell ps -A | grep jp.garud.ssimulator | tee "$OUT/processes-after-host.txt" || true

            adb shell am start-user -w "$CLIENT_USER"
            adb shell am switch-user "$CLIENT_USER"
            sleep 4
            adb shell am get-current-user | tee "$OUT/current-user-client.txt"

            echo "=== CLIENT USER $CLIENT_USER ==="
            adb shell am start -W --user "$CLIENT_USER" \
              -n jp.garud.ssimulator/jp.garud.ssimulator.SakuraLanActivity \
              --es sakuralan_mode join \
              --es sakuralan_host 127.0.0.1 \
              --ei sakuralan_port 38556 | tee "$OUT/client-start.txt"
            sleep 12

            adb shell ps -A | grep jp.garud.ssimulator | tee "$OUT/processes-after-client.txt" || true
            adb exec-out screencap -p > "$OUT/client-after-join.png" || true
            adb logcat -d -v threadtime > "$OUT/logcat-two-users.txt" || true
            grep 'SakuraLAN' "$OUT/logcat-two-users.txt" > "$OUT/sakuralan-two-users.txt" || true

            adb shell am switch-user 0
            sleep 5
            adb exec-out screencap -p > "$OUT/host-after-join.png" || true
            adb shell ps -A | grep jp.garud.ssimulator > "$OUT/processes-final.txt" || true

            echo "=== LAN EVIDENCE ==="
            cat "$OUT/sakuralan-two-users.txt" || true

            grep -q 'NET HOST OK' "$OUT/sakuralan-two-users.txt"
            grep -q 'NET DIRECT JOIN OK' "$OUT/sakuralan-two-users.txt"
            grep -q 'Client joined' "$OUT/sakuralan-two-users.txt"

      - name: Upload two-user LAN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-dual-user-lan
          path: sakura-lan-mod/dual/evidence/
          if-no-files-found: warn


  current-x86-arm-translation:
    needs: build-patched-apks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/x86/prebuilt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Run patched ARM64 Sakura through API 35 ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            mkdir -p sakura-lan-mod/x86/evidence
            adb shell getprop ro.product.cpu.abilist > sakura-lan-mod/x86/evidence/abilist.txt
            adb shell getprop ro.dalvik.vm.native.bridge > sakura-lan-mod/x86/evidence/native-bridge.txt
            adb install-multiple -r sakura-lan-mod/x86/prebuilt/jp.garud.ssimulator.apk sakura-lan-mod/x86/prebuilt/config.arm64_v8a.apk sakura-lan-mod/x86/prebuilt/UnityDataAssetPack.apk
            adb logcat -c
            adb shell monkey -p jp.garud.ssimulator -c android.intent.category.LAUNCHER 1 || true
            sleep 10
            adb exec-out screencap -p > sakura-lan-mod/x86/evidence/lan-menu.png || true
            adb shell pidof jp.garud.ssimulator > sakura-lan-mod/x86/evidence/pid.txt || true
            adb logcat -d -v threadtime > sakura-lan-mod/x86/evidence/logcat.txt || true
            grep 'SakuraLAN' sakura-lan-mod/x86/evidence/logcat.txt > sakura-lan-mod/x86/evidence/sakuralan-log.txt || true
            grep -Ei 'FATAL EXCEPTION|SIGABRT|SIGSEGV|UnsatisfiedLinkError|INSTALL_FAILED|NO_MATCHING_ABIS|integrity|pairip|pgl' sakura-lan-mod/x86/evidence/logcat.txt > sakura-lan-mod/x86/evidence/fatal-log.txt || true
            cat sakura-lan-mod/x86/evidence/abilist.txt
            cat sakura-lan-mod/x86/evidence/native-bridge.txt || true
            cat sakura-lan-mod/x86/evidence/sakuralan-log.txt || true
            cat sakura-lan-mod/x86/evidence/fatal-log.txt || true
            test -s sakura-lan-mod/x86/evidence/pid.txt

      - name: Upload x86 ARM-translation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-x86-arm-translation
          path: sakura-lan-mod/x86/evidence/
          if-no-files-found: warn

  dual-user-x86-lan-smoke:
    needs: build-patched-apks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sakura-current-patched-apks
          path: sakura-lan-mod/x86-dual/prebuilt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Connect Host and Client in two Android users
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            mkdir -p sakura-lan-mod/x86-dual/evidence
            adb install-multiple -r sakura-lan-mod/x86-dual/prebuilt/jp.garud.ssimulator.apk sakura-lan-mod/x86-dual/prebuilt/config.arm64_v8a.apk sakura-lan-mod/x86-dual/prebuilt/UnityDataAssetPack.apk
            adb shell pm create-user SakuraClient > sakura-lan-mod/x86-dual/evidence/create-user.txt
            sed -n 's/.* id \([0-9][0-9]*\).*/\1/p' sakura-lan-mod/x86-dual/evidence/create-user.txt > sakura-lan-mod/x86-dual/evidence/client-user-id.txt
            adb logcat -c
            adb shell am start -W --user 0 -n jp.garud.ssimulator/jp.garud.ssimulator.SakuraLanActivity --es sakuralan_mode host > sakura-lan-mod/x86-dual/evidence/host-start.txt
            sleep 6
            adb shell ps -A | grep jp.garud.ssimulator > sakura-lan-mod/x86-dual/evidence/processes-host.txt || true
            CLIENT_USER="$(cat sakura-lan-mod/x86-dual/evidence/client-user-id.txt)"; adb shell pm install-existing --user "$CLIENT_USER" jp.garud.ssimulator
            CLIENT_USER="$(cat sakura-lan-mod/x86-dual/evidence/client-user-id.txt)"; adb shell am start-user -w "$CLIENT_USER"
            CLIENT_USER="$(cat sakura-lan-mod/x86-dual/evidence/client-user-id.txt)"; adb shell am switch-user "$CLIENT_USER"
            sleep 3
            CLIENT_USER="$(cat sakura-lan-mod/x86-dual/evidence/client-user-id.txt)"; adb shell am start -W --user "$CLIENT_USER" -n jp.garud.ssimulator/jp.garud.ssimulator.SakuraLanActivity --es sakuralan_mode join --es sakuralan_host 127.0.0.1 --ei sakuralan_port 38556 > sakura-lan-mod/x86-dual/evidence/client-start.txt
            sleep 12
            adb exec-out screencap -p > sakura-lan-mod/x86-dual/evidence/client-after-join.png || true
            adb logcat -d -v threadtime > sakura-lan-mod/x86-dual/evidence/logcat.txt || true
            grep 'SakuraLAN' sakura-lan-mod/x86-dual/evidence/logcat.txt > sakura-lan-mod/x86-dual/evidence/sakuralan.txt || true
            adb shell am switch-user 0
            sleep 3
            adb exec-out screencap -p > sakura-lan-mod/x86-dual/evidence/host-after-join.png || true
            adb shell ps -A | grep jp.garud.ssimulator > sakura-lan-mod/x86-dual/evidence/processes-final.txt || true
            cat sakura-lan-mod/x86-dual/evidence/sakuralan.txt || true
            grep -q 'NET HOST OK' sakura-lan-mod/x86-dual/evidence/sakuralan.txt
            grep -q 'NET DIRECT JOIN OK' sakura-lan-mod/x86-dual/evidence/sakuralan.txt
            grep -q 'Client joined' sakura-lan-mod/x86-dual/evidence/sakuralan.txt

      - name: Upload dual-user x86 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakura-dual-user-x86-lan
          path: sakura-lan-mod/x86-dual/evidence/
          if-no-files-found: warn
