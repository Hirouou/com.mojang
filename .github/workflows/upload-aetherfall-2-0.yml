name: Upload Aetherfall 2.0 release asset

on:
  push:
    paths:
      - .github/workflows/upload-aetherfall-2-0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the original ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          download_url = 'https://download851.mediafire.com/9is01u6bdz4gLR-O6OP-8yxG2oyh2B2pK_dU75lySvbS8QIDvbP_ddDRbbmaEP-z5IlQpKQHaHFqPOgW293Tam17B9aFx5AbEQAD1kWnAcfd8QWelpqyBft_oDW-OUtCaIoc7XqhjR9h0tfN9PYbnrq3A-oUwtXHWpl03plqHsRmHA/d6dpq8w5wva45vo/Aetherfall-2.0-Compartilhar-2026-10-19_18-51-43.zip'
          archive = Path('Aetherfall-2.0-Compartilhar-2026-10-19_18-51-43.zip')
          expected_size = 901084665
          expected_sha256 = '2ea92a7cb6db8d8660563018ea86972f97152a7ae7170a3209e470d0887e16d9'

          subprocess.run([
              'curl', '--fail', '--location', '--retry', '5', '--retry-all-errors',
              '--continue-at', '-', '--output', str(archive), download_url,
          ], check=True)
          if archive.stat().st_size != expected_size:
              raise RuntimeError('Downloaded ZIP has an unexpected size')
          with archive.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          if digest != expected_sha256:
              raise RuntimeError('Downloaded ZIP failed SHA-256 verification')
          print(f'Verified ZIP: {expected_size} bytes; SHA-256: {digest}')
          PY
      - name: Upload the verified ZIP to the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload aetherfall-2.0-2026-10-19
          Aetherfall-2.0-Compartilhar-2026-10-19_18-51-43.zip
          --repo "$GITHUB_REPOSITORY"
